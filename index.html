<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="くわがた荘">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#3f5a2a">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>くわがた荘 – クワガタ飼育ゲーム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ecd9; --panel:#f4f6ea; --ink:#222c1c; --mute:#5d6951; --line:#c4cdac;
  --sap:#b87110; --sap-ink:#ffffff; --bark:#3a2a1d; --leaf:#4f7d27; --warn:#b3402a;
  --tape:#f0dc8c; --tape-ink:#3b3216; --shadow:rgba(40,50,25,.18);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121910; --panel:#1c2619; --ink:#e5ebd2; --mute:#9aa88a; --line:#31402b;
    --sap:#e5a73a; --sap-ink:#2a1c05; --leaf:#8fbf55; --warn:#ef7a5f;
    --tape:#d8c36e; --tape-ink:#2c2610; --shadow:rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --bg:#121910; --panel:#1c2619; --ink:#e5ebd2; --mute:#9aa88a; --line:#31402b;
  --sap:#e5a73a; --sap-ink:#2a1c05; --leaf:#8fbf55; --warn:#ef7a5f;
  --tape:#d8c36e; --tape-ink:#2c2610; --shadow:rgba(0,0,0,.45);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:border-box;}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:500 15px/1.6 "Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;
  -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;cursor:pointer;}
button:focus-visible,.tile:focus-visible{outline:3px solid var(--sap);outline-offset:2px;}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:2px solid var(--line);padding:10px 14px 8px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.brand{display:flex;align-items:baseline;gap:10px;}
h1{margin:0;font:400 22px/1.1 "Dela Gothic One","Zen Kaku Gothic New",sans-serif;letter-spacing:.02em;}
.day{color:var(--mute);font-weight:700;font-size:13px;}
.pt{font:400 20px/1 "Dela Gothic One",sans-serif;color:var(--sap);}
.pt small{font:700 12px "Zen Kaku Gothic New",sans-serif;color:var(--mute);margin-left:3px;}
.ctrl{display:flex;gap:10px;margin-top:8px;align-items:center;flex-wrap:wrap;}
.seg{display:inline-flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel);}
.seg button{border:0;background:transparent;padding:5px 11px;font-weight:700;font-size:13px;}
.seg button[aria-pressed="true"]{background:var(--sap);color:var(--sap-ink);}
.cap{font-size:12px;color:var(--mute);font-weight:700;}
#tempNote{font-size:12px;color:var(--mute);margin-top:4px;min-height:18px;}

main{padding:14px 14px 110px;max-width:640px;margin:0 auto;}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--panel);border-top:2px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom,0px));gap:6px;}
.tabs button{flex:1;border:0;background:transparent;border-radius:12px;padding:8px 4px;font-weight:700;font-size:13px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:1px;}
.tabs button span{font-size:20px;line-height:1.1;}
.tabs button[aria-current="true"]{background:var(--sap);color:var(--sap-ink);}

/* cards */
.card{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:12px 14px;margin-bottom:12px;}
.card h2{margin:0 0 4px;font-size:15px;font-weight:900;}
.card p{margin:4px 0;font-size:14px;}
.card details summary{font-weight:900;cursor:pointer;}
.card ul{margin:6px 0 0;padding-left:1.2em;font-size:14px;}
.card li{margin:3px 0;}
.btn{border:0;border-radius:12px;padding:11px 14px;font-weight:900;background:var(--sap);color:var(--sap-ink);font-size:15px;}
.btn.ghost{background:transparent;border:2px solid var(--line);color:var(--ink);}
.btn.danger{background:transparent;border:2px solid var(--warn);color:var(--warn);}
.btn:disabled{opacity:.42;cursor:not-allowed;}
.btn small{font-weight:700;opacity:.85;margin-left:4px;}
.btns{display:grid;gap:8px;margin-top:10px;}
.btns.two{grid-template-columns:1fr 1fr;}

/* shelf */
.shelfhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:2px 0 10px;}
.shelfhead b{font-size:14px;}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 12px;}
.tile{position:relative;display:block;width:100%;padding:0;text-align:left;border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel);box-shadow:0 3px 0 var(--shadow);}
.tile .lid{height:9px;background:var(--bark);border-bottom:2px solid rgba(0,0,0,.25);}
.art{aspect-ratio:200/170;background:#2b1d13;overflow:hidden;position:relative;}
.art svg{display:block;width:100%;height:100%;}
.tile .label{position:relative;margin:-16px 8px 6px;padding:5px 8px 6px;background:var(--tape);color:var(--tape-ink);border-radius:3px;transform:rotate(-1.4deg);box-shadow:0 1px 0 rgba(0,0,0,.25);}
.grid .tile:nth-child(even) .label{transform:rotate(1.2deg);}
.tile .label b{display:block;font-size:13px;line-height:1.25;font-weight:900;}
.tile .label .st{font-size:12px;font-weight:700;opacity:.8;}
.tile .mini{height:6px;margin:4px 10px 10px;border-radius:4px;background:var(--line);overflow:hidden;}
.tile .mini i{display:block;height:100%;background:var(--leaf);border-radius:4px;transition:width .3s;}
.tile.warn{border-color:var(--warn);}
.tile.warn .mini i{background:var(--warn);}
.tile.warn::after{content:"お世話!";position:absolute;top:14px;right:6px;background:var(--warn);color:#fff;font-weight:900;font-size:11px;padding:1px 7px;border-radius:9px;}
.tile.dead .art{filter:grayscale(1);opacity:.75;}
.tile.empty{border-style:dashed;background:transparent;min-height:180px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-weight:700;box-shadow:none;}

.log{list-style:none;margin:0;padding:0;font-size:13px;}
.log li{padding:5px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;}
.log li:last-child{border:0;}
.log .d{color:var(--mute);min-width:3.4em;font-weight:700;}
.log .bad{color:var(--warn);}
.log .good{color:var(--leaf);font-weight:700;}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,14,8,.55);z-index:30;}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:92vh;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:22px 22px 0 0;border-top:3px solid var(--line);padding:0 16px calc(24px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out;max-width:640px;margin:0 auto;}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet[hidden],.sheet-back[hidden]{display:none;}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px;}
.sheet .art.big{border-radius:16px;border:2px solid var(--line);}
.sheet-head{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 0 10px;border-bottom:2px solid var(--line);margin-bottom:12px;}
.sheet-head h2{margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 18px/1.3 "Dela Gothic One","Zen Kaku Gothic New",sans-serif;}
.sheet .stage{color:var(--mute);font-weight:700;margin:0 0 8px;font-size:14px;}
.bar{display:grid;grid-template-columns:5.6em 1fr 2.4em;align-items:center;gap:8px;margin:6px 0;font-size:13px;font-weight:700;}
.bar .track{height:10px;background:var(--line);border-radius:6px;overflow:hidden;}
.bar .track i{display:block;height:100%;background:var(--leaf);border-radius:6px;transition:width .3s;}
.bar.low .track i{background:var(--warn);}
.bar em{font-style:normal;text-align:right;color:var(--mute);}
dl.info{display:grid;grid-template-columns:auto 1fr;gap:3px 14px;margin:10px 0;font-size:14px;}
dl.info dt{color:var(--mute);font-weight:700;}
dl.info dd{margin:0;font-weight:700;}
.note{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:10px 12px;font-size:14px;margin:8px 0;}
.sheet h3{font-size:14px;margin:14px 0 4px;font-weight:900;}
.close{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:6px 16px;font-weight:900;font-size:14px;}

.sheet .stage{margin-top:10px;}
.kbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:1px;}
.kbtn span{font-weight:900;}
.kbtn em{font-style:normal;font-size:12px;font-weight:700;opacity:.85;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 10px;}
.chips span{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:12px;font-weight:700;color:var(--mute);}
.chk{list-style:none;margin:4px 0 8px;padding:0;font-size:13px;font-weight:700;}
.chk li.ok{color:var(--leaf);}
.chk li.ng{color:var(--warn);}
.drop{position:absolute;top:-10px;width:6px;height:10px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#8ec9ff;opacity:.9;animation:fall .9s ease-in forwards;}
@keyframes fall{to{transform:translateY(190px);opacity:0}}
.spark{position:absolute;font-size:18px;animation:pop .9s ease-out forwards;}
@keyframes pop{from{transform:scale(.3);opacity:1}to{transform:scale(1.4) translateY(-20px);opacity:0}}
.sway{transform-origin:100px 85px;animation:sway 7s ease-in-out infinite;}
.tile .sway{animation:none;}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}

/* dex & shop */
.dexc{display:grid;grid-template-columns:110px 1fr;gap:12px;background:var(--panel);border:2px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:12px;}
.dexc .art{aspect-ratio:auto;height:100%;min-height:120px;}
.dexc .art svg{position:absolute;inset:0;}
.dexc.unk .art svg > :not(rect){filter:brightness(0);opacity:.55;}
.dexc .dtxt{padding:10px 12px 10px 0;}
.dexc h3{margin:0;font-size:15px;font-weight:900;}
.dexc .sci{font-size:12px;color:var(--mute);font-style:italic;}
.dexc p{margin:4px 0;font-size:13px;}
.stars{color:var(--sap);letter-spacing:1px;font-size:13px;}
.shopc{display:flex;gap:12px;align-items:center;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;}
.shopc .art{width:96px;flex:none;border-radius:10px;}
.shopc .meta{flex:1;min-width:0;}
.shopc h3{margin:0;font-size:15px;font-weight:900;}
.shopc p{margin:2px 0;font-size:12px;color:var(--mute);}
.shopc .btn{padding:9px 12px;font-size:14px;white-space:nowrap;}

#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;background:var(--bark);color:#fff;padding:9px 16px;border-radius:14px;font-weight:700;font-size:14px;max-width:88%;text-align:center;pointer-events:none;opacity:0;transition:opacity .2s;}
#toast.on{opacity:1;}
@media (prefers-reduced-motion:reduce){.sway,.sheet,.drop,.spark{animation:none!important;}}

/* v2 */
.seg.full{display:flex;width:100%;margin-bottom:12px}
.seg.full button{flex:1}
.btn.sm{padding:7px 12px;font-size:13px}
.envgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 2px}
.env{background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:6px 4px;text-align:center}
.env small{display:block;font-size:11px;color:var(--mute);font-weight:700}
.env b{font:400 18px/1.3 "Dela Gothic One","Zen Kaku Gothic New",sans-serif}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px;flex-wrap:wrap}
.ctl .lb{font-weight:900;font-size:14px;min-width:0}
.ctl .lb small{display:block;font-weight:700;color:var(--mute);font-size:11px}
.step{display:inline-flex;align-items:center;gap:6px}
.step button:not(.btn){width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--panel);font-weight:900;font-size:18px;line-height:1}
.step b{min-width:3.4em;text-align:center;font-size:15px}
.bar .track{position:relative}
.bar .zone{position:absolute;top:0;bottom:0;background:rgba(79,125,39,.3);border-left:2px solid var(--leaf);border-right:2px solid var(--leaf);text-decoration:none}
.bar .track i{position:relative}
.tsc{margin:6px 0 10px}
.tsl{display:flex;align-items:baseline;gap:8px;font-size:13px;font-weight:700;flex-wrap:wrap}
.tsl b{font-weight:900}
.tsl em{font-style:normal;margin-left:auto;color:var(--mute);font-size:12px}
.tsc.mid .tsl b{color:var(--sap)}
.tsc.hot .tsl b{color:var(--warn)}
.tsb{position:relative;height:12px;border-radius:7px;background:var(--line);margin-top:4px}
.tsb .ok{position:absolute;top:0;bottom:0;background:rgba(79,125,39,.45);border-radius:7px}
.tsb .mk{position:absolute;top:-3px;width:5px;height:18px;margin-left:-2px;border-radius:3px;background:var(--ink);border:1px solid var(--bg)}
.bdg{position:absolute;top:12px;left:6px;z-index:2;font-size:11px;font-weight:900;background:rgba(0,0,0,.6);color:#fff;border-radius:9px;padding:0 7px}
.bdg.hot{background:var(--warn)}
.hold{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.hold.on{background:var(--sap);color:var(--sap-ink);border-color:var(--sap)}
.mtag{display:inline-block;background:var(--tape);color:var(--tape-ink);border-radius:6px;padding:0 7px;font-size:12px;font-weight:900}
.spc{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;border-top:1px dashed var(--line);padding:8px 0}
.spc .art{aspect-ratio:1;border-radius:10px;background:#2b1d13}
.spc b{font-size:14px}
.spc p{margin:2px 0;font-size:12px}
.board{margin:6px 0 0;padding-left:1.6em;font-size:14px}
.board li{padding:2px 0}
.board li.me{color:var(--sap);font-weight:900}
.cap2{font-size:12px;color:var(--mute)}
.shnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.shnav>div{text-align:center;flex:1}
.shnav b{display:block;font:400 18px/1.2 "Dela Gothic One","Zen Kaku Gothic New",sans-serif}
.shnav small{font-size:12px;color:var(--mute);font-weight:700}
.shnav button{width:48px;height:42px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-weight:900;font-size:18px}
.shnav button:disabled{opacity:.35}
.tile .mkr{position:absolute;top:32px;left:6px;z-index:2;font-size:20px;line-height:1;font-weight:900;text-shadow:0 0 3px #000,0 0 3px #000,0 0 2px #000}
.tile .lid{transition:background .2s}
.mkrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.mkb{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:5px 10px;font-weight:900;font-size:14px;min-width:38px}
.mkb.on{border-color:var(--sap);background:var(--sap);color:var(--sap-ink)}
.mcb{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);padding:0}
.mcb.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg) inset}
.shopc{align-items:flex-start}
.shopc .meta{flex:1;min-width:0}
.sbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.sbtns .btn{padding:8px 6px;font-size:13px;white-space:nowrap}
.treewrap{overflow-x:auto;padding:6px 0 10px;-webkit-overflow-scrolling:touch}
.tree{display:flex;justify-content:center;margin:0 0 14px;padding:0;min-width:max-content}
.tree ul{display:flex;justify-content:center;margin:0;padding:14px 0 0;position:relative}
.tree li{list-style:none;position:relative;padding:14px 5px 0;display:flex;flex-direction:column;align-items:center}
.tree>li{padding-top:0}
.tree li::before,.tree li::after{content:"";position:absolute;top:0;right:50%;width:50%;height:14px;border-top:2px solid var(--line)}
.tree li::after{right:auto;left:50%;border-left:2px solid var(--line)}
.tree li:only-child::before,.tree li:only-child::after{display:none}
.tree li:only-child{padding-top:0}
.tree>li::before,.tree>li::after{display:none}
.tree>li:only-child{padding-top:0}
.tree li:first-child::before,.tree li:last-child::after{border:0 none}
.tree li:last-child::before{border-right:2px solid var(--line);border-radius:0 6px 0 0}
.tree li:first-child::after{border-radius:6px 0 0 0}
.tree li>ul::before{content:"";position:absolute;top:0;left:50%;height:14px;border-left:2px solid var(--line)}
.couple{display:flex;align-items:center;gap:3px}
.couple>i{font-style:normal;color:var(--mute);font-weight:900}
.nd{border:2px solid var(--line);background:var(--panel);border-radius:10px;padding:3px 7px;text-align:center;font-size:11px;font-weight:700;line-height:1.35;min-width:74px;position:relative}
.nd b{display:block;font-size:12px;font-weight:900}
.nd span{display:block;color:var(--mute)}
.nd.m{border-top:4px solid #5b8fd6}
.nd.f{border-top:4px solid #e07aa6}
.nd.spec{border-color:var(--leaf);background:rgba(79,125,39,.18)}
.nd.spec span{color:var(--ink)}
.nd.unk{border-style:dashed;opacity:.8}
.nd .dot{position:absolute;top:-6px;right:-6px;width:12px;height:12px;border-radius:50%;border:2px solid var(--bg)}
.nd .mkc{font-style:normal;margin-left:2px}
.lone{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:4px}
/* v3 tree / ped detail */
.pedblk{margin:10px 0 14px}
.pedt{font-size:12px;font-weight:900;color:var(--mute);margin-bottom:4px}
.pedsvg{display:block;margin:0 auto;max-width:none}
.pedsvg .ln{stroke:var(--mute);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.pedsvg .cell{fill:var(--panel);stroke:var(--line);stroke-width:2}
.pedsvg .cell.spec{stroke:var(--leaf);stroke-width:3;fill:rgba(79,125,39,.14)}
.pedsvg .cell.gone{stroke-dasharray:5 4}
.pedsvg .sx-m{fill:#5b8fd6}
.pedsvg .sx-f{fill:#e07aa6}
.pedsvg .nt{font:900 11px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;fill:var(--ink)}
.pedsvg .nt2{font:700 10px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;fill:var(--mute)}
.pedsvg .nt3{font:700 9.5px "Zen Kaku Gothic New","Hiragino Sans",sans-serif;fill:var(--mute)}
.pedsvg .ghe{fill:none;stroke:var(--mute);stroke-width:2;stroke-dasharray:4 3}
.pedsvg .ght{font:900 18px sans-serif;fill:var(--mute)}
.pedsvg .bdy{stroke:rgba(0,0,0,.4);stroke-width:1}
.pedsvg g[data-act]{cursor:pointer}
.pedsvg g[data-act]:hover .cell{stroke:var(--sap)}
.pedsvg g[data-act]:focus-visible{outline:3px solid var(--sap)}
.pdgrid{display:grid;grid-template-columns:minmax(130px,.85fr) 1.15fr;border:2px solid var(--line);border-radius:14px;overflow:hidden}
.pdl{background:var(--bg);padding:10px}
.pdl .art.big{border-radius:12px;border:2px solid var(--line);aspect-ratio:200/170}
.pdl .noimg{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 40px "Dela Gothic One",sans-serif;color:var(--mute);background:var(--panel)}
.pdl .noimg small{font:700 11px sans-serif}
.gg{position:relative;height:8px;border-radius:5px;background:var(--line);margin:12px 4px 4px}

function syncLines(){
  const par=new Map();
  const add=x=>{if(!par.has(x))par.set(x,x);};
  const find=x=>{let r=x;while(par.get(r)!==r)r=par.get(r);while(par.get(x)!==r){const n=par.get(x);par.set(x,r);x=n;}return r;};
  const uni=(a,b)=>{add(a);add(b);const ra=find(a),rb=find(b);if(ra!==rb)par.set(ra,rb);};
  const grp=new Map();
  for(const p of Object.values(S.ped)){
    add(p.id);
    if(p.pa)uni(p.id,p.pa);
    if(p.ma)uni(p.id,p.ma);
    if(p.gr){if(grp.has(p.gr))uni(p.id,grp.get(p.gr));else grp.set(p.gr,p.id);}
  }
  const comps=new Map();
  for(const x of par.keys()){const r=find(x);if(!comps.has(r))comps.set(r,[]);comps.get(r).push(x);}
  const lines=[];
  for(const ids of comps.values()){
    const mem=ids.filter(id=>S.ped[id]);
    if(!mem.length)continue;
    const spec=mem.filter(id=>S.ped[id].f==='p');
    const ks=[...new Set(mem.map(id=>S.ped[id].bl).filter(k=>k&&S.bl[k]))];
    if(!spec.length&&!ks.length)continue;
    let key;
    if(!ks.length){key='L'+(S.blN++);S.bl[key]={name:'',pg:0,sp:S.ped[mem[0]].sp};}
    else if(ks.length===1)key=ks[0];
    else{
      ks.sort((a,b)=>{const pa=S.bl[a].pg||1e9,pb=S.bl[b].pg||1e9;return pa-pb||(+a.slice(1))-(+b.slice(1));});
      key=ks[0];
      const names=[...new Set(ks.map(k=>S.bl[k].name).filter(Boolean))];
      S.bl[key].name=names.join('・').slice(0,12);
      ks.slice(1).forEach(k=>delete S.bl[k]);
    }
    mem.forEach(id=>{S.ped[id].bl=key;});
    lines.push({key,sp:S.ped[mem[0]].sp,mem,spec});
  }
  const live=new Set(lines.map(l=>l.key));
  Object.keys(S.bl).forEach(k=>{if(!live.has(k))delete S.bl[k];});
  const act=lines.filter(l=>l.spec.length).sort((a,b)=>(+a.key.slice(1))-(+b.key.slice(1)));
  lines.filter(l=>!l.spec.length).forEach(l=>{S.bl[l.key].pg=0;});
  const used=new Set(act.map(l=>S.bl[l.key].pg).filter(Boolean));
  for(const l of act){
    const r=S.bl[l.key];if(r.pg)continue;
    for(let i=1;i<=nbCap();i++)if(!used.has(i)){r.pg=i;used.add(i);break;}
  }
  return act;
}

}

function emerge(b,sp){

      if(!pre){
        const kl=b.kind==='kin'||b.kind==='kaw';
        /* 暴れ(ワンダリング): 終齢で起きる。エサが減るほど、菌糸ほど起きやすい。エサ交換で治る */
        if(sp.wan&&!b.wan&&b.prog>=L*.5&&!(sp.wanKin&&!kl)){
          const p=.01*sp.wan*(kl?1.4:.6)*(b.food<50?1+(50-b.food)/25:1);
          if(Math.random()<p*dt){b.wan=true;log(`${bname(b)}が暴れ始めた(エサを交換しよう)`,'bad');}
        }
        b.food=Math.max(0,b.food-dt*K.dec*(.6+.8*Math.min(1,b.w/pk))*(b.wan?1.5:1)*dk);
        const ff=b.food>=30?1:(b.food>0?.4+.6*b.food/30:0);
        /* 低温種を適温で育てると大きく育つ */
        const gain=pk*1.05/sp.larva*K.g*fmv*(sp.cold&&sx===0?1.1:1);
        if(b.wan)b.w=Math.max(pk*.3,b.w-dt*pk*.015);
        else b.w=Math.min(pk*1.3,b.w+dt*gain*ff*gm);
        if(b.food<=0)b.hp-=dt*2.5*dk;
        else if(fmv<=.05)b.hp-=dt*1.6*dk;
        else if(sp.drop&&fmv<.3&&Math.random()<dt*.03){die(b,'エサ不足');continue;}
        else if(b.hp<100&&dr<.1)b.hp=Math.min(100,b.hp+dt*.6);
        if(kl&&b.prog>=L*.2)b.kinT=(b.kinT||0)+dt;
      }
      /* オオクワ: 2齢以降の温度の幅を記録(セミ化の判定用) */
      if(sp.semi&&b.prog>=L*.2){b.tlo=Math.min(b.tlo==null?t:b.tlo,t);b.thi=Math.max(b.thi==null?t:b.thi,t);}
      if(b.semi&&b.age>=L*2.2){die(b,'セミ化(季節の温度変化がなく、蛹になれなかった)');continue;}
      if(dr>0)b.hp-=dt*dr*dk;
      if(off&&b.hp<5&&b.hp>0)b.hp=5;
      if(b.hp<=0){die(b,causeOf(b,sx,t));continue;}
      if(b.inb>.2&&Math.random()<b.inb*b.inb*.004*dt){die(b,'近親交配の影響で脱落');continue;}
      b.prog+=dt*dm;
      if(b.prog>=L&&sp.semi&&!b.semi&&!b.semiChk){
        b.semiChk=1;
        const rg=(b.thi==null?0:b.thi-b.tlo);
        if(Math.random()<clamp((3-rg)/3,0,1)*.6)b.semi=true;
      }
      if(b.semi&&b.prog>=L)b.prog=L*.86;
      if(b.prog>=L){
        if(Math.random()<b.inb*b.inb*.3){die(b,'前蛹で脱落(近交退化)');continue;}
        b.stage='pupa';b.prog=0;b.q=clamp(b.w/(pk*1.25),0,1);b.hp=100;log(`${bname(b)}が蛹になった`);
      }
    }else if(b.stage==='pupa'){
      if(dr>0){b.hp-=dt*dr*dk;if(off&&b.hp<5&&b.hp>0)b.hp=5;}
      if(b.hp<=0){die(b,causeOf(b,sx,t));continue;}
      b.prog+=dt*dm;
      if(b.prog>=PUPA){
        if(Math.random()<b.inb*b.inb*.18){die(b,'蛹で脱落(近交退化)');continue;}
        emerge(b,sp);
      }
    }else if(b.stage==='adult'){
      const mt=mature(b),M=MATS[b.mat]||MATS.ferm,J=JELLY[b.jk]||JELLY.norm;
      /* 冬眠(ヒラタ): 室温15°C以下で冬眠、18°C以上で目覚める */
      if(sp.hib&&mt){
        if(!b.hib&&t<=15){b.hib=true;log(`${bname(b)}が冬眠に入った`);}
        else if(b.hib&&t>=18){b.hib=false;log(`${bname(b)}が冬眠から目覚めた`,'good');}
      }else b.hib=false;
      b.adultAge+=dt*am*(b.hib?.1:1)*(b.bind?1.5:1);
      b.cool=Math.max(0,b.cool-dt);
      let bad=false;
      if(mt&&b.hib){
        const sh=shOf(b),cl=b.cel&&celOn();
        b.moist=Math.max(0,b.moist-dt*.4*M.moist*dry*AMB(sh)*(sh.humid?.35:1)*(cl?.5:1)*dk);
        bad=b.moist<=0;
        if(bad)b.hp-=dt*2.2*dk;
        else if(b.moist>25&&b.hp<100)b.hp=Math.min(100,b.hp+dt*.5);
      }else if(mt){
        const cl=b.cel&&celOn();
        const sh=shOf(b);
        b.food=Math.max(0,b.food-dt*J.dec*dk);
        b.moist=Math.max(0,b.moist-dt*1.1*(sp.wet||1)*M.moist*J.wet*dry*AMB(sh)*(sh.humid?.35:1)*(cl?.5:1)*dk);
        if(sh.humid&&!cl&&b.moist<50)b.moist=Math.min(50,b.moist+dt*1.2*dk);
        b.clean=Math.max(0,b.clean-dt*1.4*(sp.dirt||1)*M.clean*J.dirt*(b.moist>85?1.5:1)*(t>26?1.25:1)*(sh.humid?1.1:1)*dk);
        bad=b.food<=0||b.moist<=0||b.clean<=0;
        if(bad)b.hp-=dt*2.2*dk;
        else if(b.moist>(sp.muggy||92))b.hp-=dt*.6*dk;
        else if(b.food>25&&b.moist>25&&b.clean>25&&b.hp<100&&dr<.1)b.hp=Math.min(100,b.hp+dt*.8*J.heal);
      }
      if(dr>0&&!(b.hib&&t>=3))b.hp-=dt*dr*dk;
      if(off&&b.hp<5&&b.hp>0)b.hp=5;
      if(b.mated&&!b.hib){b.eggTimer-=dt;if(b.eggTimer<=0)lay(b);}
      if(b.hp<=0){die(b,causeOf(b,sx,t));continue;}
      if(b.adultAge>=b.life)die(b,'老衰',true);
    }
  }
}
function sim(days,off){let r=days;while(r>1e-6){const d=Math.min(r,.5);step(d,off);r-=d;}}
function catchUp(sec){
  const s=Math.min(sec,OFFLINE_CAP),days=s/DAY_SEC/OFFLINE_SLOW;
  if(days<.5)return;
  awayCap=[];
  const d0=Math.floor(S.day);
  try{sim(days,true);}finally{
    const ev=awayCap;awayCap=null;
    /* 留守中のまとめ: 重要度順(悪い知らせ → 良い知らせ → その他) */
    const pr=e=>e.k==='bad'?0:e.k==='good'?1:2;
    const items=ev.slice().sort((a,b)=>pr(a)-pr(b)||a.d-b.d);
    const live=S.beetles.filter(b=>b.stage!=='dead');
    const care=live.filter(b=>attn(b)||b.hp<=6||b.bind).map(b=>b.id);
    lastAway={days:Math.round(days),from:d0,to:Math.floor(S.day),items,care,bad:ev.filter(e=>e.k==='bad').length,good:ev.filter(e=>e.k==='good').length};
  }
  toast(`おかえり! 留守のあいだに ${Math.round(days)}日 経ちました`);
  if(days>=3&&(lastAway.items.length||lastAway.care.length)&&typeof openAway==='function'&&!awayHold())setTimeout(openAway,350);
}

function resolveContest(){
  const c=S.ct;c.done=true;
  const id=CTS[c.n%CTS.length],sp=SP[id],name=cTitle(id),dd=Math.floor(S.day);
  const names=NPCN.slice().sort(()=>Math.random()-.5),board=[];

    prize=[150+60*sp.star,80+30*sp.star,40+15*sp.star][place-1]||15;
    S.coins+=prize;

}

function careIssues(b){

  const t=caseT(b),sx=tstress(sp,t),[lo,hi]=sp.pref,mid=(lo+hi)/2;

function mandShape(mp,L,th,bx,by,col,hl){

    if(i%8===0)mid.push([P[0]-nx*w*.35,P[1]-ny*w*.35]);
    last=[tx,ty];

  const pt=p=>f1(p[0])+' '+f1(p[1]);

  d+='L'+pt([T[0]+last[0]*3,T[1]+last[1]*3]);

function pupaG(b,sp){

function doPair(aid,bid){
  const a=byId(aid),b=byId(bid);
  if(!a||!b||!eligible(a)||!eligible(b)||a.sp!==b.sp||a.sex===b.sex)return;
  const f=a.sex==='f'?a:b,m=a.sex==='m'?a:b;
  const bad=reqs(f).find(r=>!r.ok);
  if(bad){toast('条件がたりません: '+bad.t);sfx('err');return;}
  /* 気性の荒いオスはメスを傷つけることがある(アゴ縛り中は起きない) */
  const ag=SP[f.sp].ag||0;
  if(ag>0&&!m.bind&&Math.random()<ag*.45*Math.pow(m.tem||0,1.5)*(.3+.7*ratioOf(m))){
    if(Math.random()<.15+.5*(m.tem||0)){
      m.cool=8;die(f,'ペアリング中にオスに噛まれた');
      log(`${bname(m)}が${bname(f)}を噛んでしまった…(アゴ縛りで防げます)`,'bad');toast('事故! メスが死んでしまいました');return;
    }
    f.inj=true;log(`${bname(m)}が${bname(f)}を傷つけた。メスの産卵数が減ってしまった`,'bad');toast('事故! メスがけがをしました(産卵数が減ります)');
  }
  if(SP[f.sp].lay==='wood')S.wood--;
  f.mated=true;f.fcol=m.col;f.fcs=m.cs;f.eggTimer=rnd(10,15);m.cool=8;
  f.mate={id:m.id,tem:m.tem,tone:m.tone,anc:Object.assign({},m.anc),inb:m.inb,gen:m.gen,gp:m.gp,ratio:ratioOf(m),mu:m.mu.filter(x=>x==='we'||x==='re'),col:m.col,cs:m.cs,size:m.size,mark:m.mark||'',mc:m.mc==null?-1:m.mc};
  const kin=kinship(f,f.mate);
  log(`${bname(m)}と${bname(f)}がペアリング。約${Math.round(f.eggTimer)}日後に産卵予定${kin>=.12?`(血が近い組み合わせ! 近縁度${Math.round(kin*100)}%)`:''}`,kin>=.12?'bad':'good');
  toast(kin>=.12?'ペアリング成功(血が近いので近交度に注意)':'ペアリング成功!');sfx('pair');
}
function collect(){
  const se=seasonIdx(S.day);
  if(se===3){toast('冬は採集できません(越冬個体を譲ってもらえることがあります)');sfx('err');return;}
  if(Date.now()<S.catchAt){toast('まだ準備中です');sfx('err');return;}
  if(free()<1){toast('空きスロットがありません');sfx('err');return;}
  S.catchAt=Date.now()+45000;
  let cnt;
  if(se===1){const r=Math.random();cnt=r<.15?0:r<.5?1:r<.8?2:3;}
  else cnt=Math.random()<(se===0?.35:.4)?0:1;
  cnt=Math.min(cnt,free());
  if(cnt<1){log(`採集に行ったが、今回は空振り…(${seasonOf(S.day)})`);toast('今回は空振りでした…');sfx('miss');return;}
  const got=[];
  for(let i=0;i<cnt;i++){
    const id=wpick(WILD),sp=SP[id],sex=Math.random()<.5?'m':'f';
    const b=mk(id,sex,'adult',{adultAge:adultAgeOf(sp),rd:true,rp:true,q:rnd(.15,.7),wd:true,gen:0,gp:rnd(.3,.7),food:80,moist:80});
    b.size=calcSize(sp,sex,b.q,b.gp);pedSync(b);
    addBeetle(b);seen(id,sex,b.size);got.push(b);
    log(`採集成功! ${bname(b)}(WD) ${b.size}mm を見つけた`,'good');
  }
  toast(cnt===1?`${SP[got[0].sp].name}${got[0].sex==='m'?'♂':'♀'} ${got[0].size}mm を採集!`:`${cnt}匹を採集しました!`);sfx('catch');
}

function removeB(id,fate){
  const b=byId(id);

/* 棚の中で b を target の位置へ(target が null なら末尾へ) */
function placeB(b,target){
  const sh=b.sh;
  const list=S.beetles.filter(x=>x.sh===sh&&x!==b);
  let k=target?list.indexOf(target):list.length;
  if(target&&S.beetles.indexOf(b)<S.beetles.indexOf(target))k++;
  list.splice(k<0?list.length:k,0,b);
  /* 棚の中の並びだけ入れ替え、他の棚の並びはそのまま */
  let li=0;const res=[];
  for(const x of S.beetles){if(x.sh===sh)res.push(list[li++]);else res.push(x);}
  S.beetles=res;
}
/* ---------- ドラッグ&ドロップ(長押しで持ち上げ。マウスは少し動かすと開始) ---------- */
let drag=null,dragSuppress=false;
function dragTargets(){
  const bar=document.createElement('div');bar.id='dropBar';bar.className='dropbar';
  let h='<span class="cap">ここに落とすと移動:</span>';
  S.shelves.forEach((x,i)=>{if(i!==drag.b.sh)h+=`<div class="dropt" data-drop-shelf="${i}">${esc(x.name)}へ<small>空き${freeIn(i)}</small></div>`;});
  if(S.cel.own&&!drag.b.cel&&drag.b.stage!=='dead')h+=`<div class="dropt" data-drop-cel="1">ワインセラーへ<small>${cellCount()}/${CEL_CAP}</small></div>`;
  bar.innerHTML=h;document.body.appendChild(bar);
}
function dragBegin(){
  const d=drag;d.on=true;
  const r=d.el.getBoundingClientRect();
  const g=d.el.cloneNode(true);g.id='dragGhost';g.className+=' ghost';g.removeAttribute('data-act');
  g.style.width=r.width+'px';g.style.left=(d.x-r.width/2)+'px';g.style.top=(d.y-r.height/2)+'px';
  document.body.appendChild(g);d.g=g;d.w=r.width;d.h=r.height;
  d.el.classList.add('lifted');document.body.classList.add('dragging');
  dragTargets();
  if(navigator.vibrate)try{navigator.vibrate(15);}catch(e){}
  sfx('tap');
}
function dragHit(x,y,d){
  d=d||drag;
  document.querySelectorAll('.droph').forEach(e=>e.classList.remove('droph'));
  const el=document.elementFromPoint(x,y);if(!el)return null;
  const t=el.closest('.dropt,[data-drop-shelf],.tile[data-id],.tile.empty');
  if(t&&t!==d.el)t.classList.add('droph');
  return t===d.el?null:t;
}
function dragEnd(cancel){
  const d=drag;drag=null;
  clearTimeout(d&&d.t);
  if(!d||!d.on)return;
  dragSuppress=true;setTimeout(()=>{dragSuppress=false;},350);
  const t=cancel?null:dragHit(d.x,d.y,d);
  if(d.g)d.g.remove();const bar=$('dropBar');if(bar)bar.remove();
  document.body.classList.remove('dragging');d.el.classList.remove('lifted');
  document.querySelectorAll('.droph').forEach(e=>e.classList.remove('droph'));
  const b=d.b;
  if(t&&byId(b.id)){
    if(t.dataset.dropShelf!=null){const i=+t.dataset.dropShelf;
      if(freeIn(i)>0){b.sh=i;toast(`${bname(b)}を${S.shelves[i].name}に移しました`);sfx('tap');}else{toast('その棚に空きがありません');sfx('err');}}
    else if(t.dataset.dropCel){if(cellCount()>=CEL_CAP){toast('ワインセラーがいっぱいです');sfx('err');}else{b.cel=true;toast(`${bname(b)}をワインセラーに入れました`);sfx('tap');}}
    else if(t.classList.contains('empty')){placeB(b,null);sfx('tap');}
    else{const o=byId(+t.dataset.id);if(o&&o!==b){placeB(b,o);sfx('tap');}}
  }
  render();save();
}
document.addEventListener('pointerdown',e=>{
  const el=e.target.closest('.tile[data-id]');
  if(!el||e.button>0||drag)return;
  const b=byId(+el.dataset.id);if(!b)return;
  drag={el,b,x:e.clientX,y:e.clientY,x0:e.clientX,y0:e.clientY,on:false,pt:e.pointerType,id:e.pointerId};
  drag.t=setTimeout(()=>{if(drag&&!drag.on)dragBegin();},e.pointerType==='mouse'?600:320);
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  drag.x=e.clientX;drag.y=e.clientY;
  const mv=Math.hypot(drag.x-drag.x0,drag.y-drag.y0);
  if(!drag.on){
    if(drag.pt==='mouse'&&mv>6){clearTimeout(drag.t);dragBegin();}
    else if(drag.pt!=='mouse'&&mv>10){clearTimeout(drag.t);drag=null;}
    if(!drag||!drag.on)return;
  }
  drag.g.style.left=(drag.x-drag.w/2)+'px';drag.g.style.top=(drag.y-drag.h/2)+'px';
  const ht=dragHit(drag.x,drag.y),onBar=ht&&ht.classList.contains('dropt');
  if(!onBar){if(drag.y<70)window.scrollBy(0,-12);else if(drag.y>window.innerHeight-180)window.scrollBy(0,12);}
});
window.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.id)dragEnd(false);});
window.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.id)dragEnd(!drag.on);});
document.addEventListener('touchmove',e=>{if(drag&&drag.on)e.preventDefault();},{passive:false});
document.addEventListener('click',e=>{if(dragSuppress&&e.target.closest('.tile,.dropt')){e.stopPropagation();e.preventDefault();dragSuppress=false;}},true);
document.addEventListener('contextmenu',e=>{if(e.target.closest('.tile[data-id]'))e.preventDefault();});
function moveB(b,d){
  const idx=[];S.beetles.forEach((x,i)=>{if(x.sh===b.sh)idx.push(i);});
  const k=idx.indexOf(S.beetles.indexOf(b)),j=k+d;
  if(j<0||j>=idx.length)return;
  const A=idx[k],B=idx[j];
  [S.beetles[A],S.beetles[B]]=[S.beetles[B],S.beetles[A]];
}

let holdT=0,holdId=null;

/* アゴ縛りのスキルチェック: 左右に揺れる針を真ん中で止める */
let jg=null;
function jawSpeed(b){const ag=SP[b.sp].ag||0;return .5+.9*ag*(.4+.8*(b.tem||0));}
function jawPos(){const p=((performance.now()-jg.t0)/1000*jg.sp)%2;return p<1?p:2-p;}
function jawStart(b){
  jawClose();
  const z=.2,zl=.5-z/2;
  const el=document.createElement('div');el.id='jawG';el.className='jawg';
  el.innerHTML=`<div class="jawbox"><b>アゴ縛り: ${esc(bname(b))}</b><p class="cap">せいかく: ${esc(temName(b))}。針が緑の範囲にあるときに止めよう</p>
    <div class="jtrack"><u style="left:${zl*100}%;width:${z*100}%"></u><i id="jawN"></i></div>
    <div class="btns"><button class="btn" data-act="jawstop">止める!</button></div></div>`;
  document.body.appendChild(el);
  jg={id:b.id,t0:performance.now(),sp:jawSpeed(b),zl,zr:zl+z,raf:0};
  const tick=()=>{if(!jg)return;const n=$('jawN');if(n)n.style.left=(jawPos()*100)+'%';jg.raf=requestAnimationFrame(tick);};
  tick();sfx('open');
}
function jawClose(){if(jg&&jg.raf)cancelAnimationFrame(jg.raf);jg=null;const e=$('jawG');if(e)e.remove();}
function jawStop(){

  jawClose();
  if(!b)return;
  if(ok){b.bind=true;log(`${bname(b)}のアゴ縛りに成功した`,'good');toast('アゴ縛り成功! 事故が起きなくなりました');sfx('emerge');}

}

    case'cellin':if(b&&S.cel.own){if(cellCount()>=CEL_CAP){toast('ワインセラーがいっぱいです');sfx('err');}else{b.cel=true;sfx('tap');toast(`${bname(b)}をワインセラーに入れました`);}}break;
    case'cellout':if(b){b.cel=false;sfx('tap');}break;
    case'kind':{const k=el.dataset.k;if(b&&KINDS[k]&&pay(KINDS[k].price)){b.food=100;b.kind=k;fx('feed');sfx('feed');if(b.wan){b.wan=false;log(`${bname(b)}がエサ交換で落ち着いた`,'good');toast(`${KINDS[k].n}に交換しました。暴れがおさまりました`);}else toast(`${KINDS[k].n}に交換しました`);}break;}
    case'jelly':{const k=el.dataset.k;if(b&&JELLY[k]&&pay(JELLY[k].price)){b.food=100;b.jk=k;fx('jelly');sfx('jelly');}break;}
    case'clean':if(b){b.clean=100;fx('clean');sfx('clean');}break;
    case'setmat':{
      const m=el.dataset.m;if(!b)break;
      if(b.mat===m){toast('すでにこのマットです');break;}
      if(pay(MATS[m].price)){b.mat=m;b.clean=100;b.moist=30;fx('feed');sfx('feed');toast(`${MATS[m].n}に交換しました(湿度が30にもどりました)`);}
      break;}
    case'pair':doPair(+el.dataset.a,+el.dataset.b);break;
    case'buy':buyEgg(el.dataset.sp);break;
    case'buywood':if(pay(WOOD_PRICE)){S.wood++;sfx('buy');toast('産卵木を1本買いました');}break;
    case'humidbuy':if(!SH().humidOwn&&pay(HUMID_PRICE)){SH().humidOwn=true;SH().humid=true;sfx('buy');toast(`${SH().name}に加湿器を設置しました`);}break;
    case'humidtoggle':if(SH().humidOwn){SH().humid=!SH().humid;sfx('tap');}break;
    case'buynb':if(S.nb<NB_MAX&&pay(NB_PRICE)){S.nb++;nbBook=S.nb-1;nbPg=1;syncLines();sfx('buy');toast(`血統ノートを買いました(${S.nb}冊目)`);}break;
    case'nbbook':nbBook=+el.dataset.v;nbPg=1;sfx('tap');break;
    case'nbpg':nbPg=+el.dataset.v;sfx('tap');break;
    case'nbstep':{const gp=clamp(nbBook*NB_PAGES+nbPg+(+el.dataset.d),1,nbCap());nbBook=Math.floor((gp-1)/NB_PAGES);nbPg=(gp-1)%NB_PAGES+1;sfx('tap');break;}
    case'celbuy':if(!S.cel.own&&pay(CEL_PRICE)){S.cel.own=true;S.cel.on=true;sfx('buy');toast('ワインセラーを導入しました');}break;
    case'slot':{const sh=SH(),cost=60*(sh.slots-5);if(sh.slots<16&&pay(cost)){sh.slots+=2;sfx('buy');toast(`${sh.name}のスロットが2つ増えました`);}break;}
    case'buyshelf':{const cost=250*S.shelves.length;if(S.shelves.length<5&&pay(cost)){S.shelves.push(newShelf('棚'+(S.shelves.length+1)));S.cur=S.shelves.length-1;sfx('buy');toast('新しい棚を設置しました');}break;}
    case'buyadult':buyAdult(el.dataset.sp,el.dataset.k);break;
    case'gacha':gachaSpin();break;
    case'enter':
      if(b&&S.ct&&cInfo().open&&cElig(b,cInfo().sp)){
        S.ct.entry={id:b.id,name:bname(b),sc:Math.round(cScore(b)*10)/10};
        sfx('pair');toast(`${bname(b)}をエントリーしました`);
      }
      break;
    case'deliver':{
      const q=S.reqs.find(r=>r.id===+el.dataset.q);
      if(!q||!b||!reqOK(q,b))break;
      const key='d'+q.id+'-'+b.id;
      if(confirmAct!==key){confirmAct=key;break;}
      S.coins+=q.rw;S.stat.req++;S.reqs=S.reqs.filter(r=>r!==q);
      log(`依頼を達成! ${bname(b)}を納品 +${q.rw}pt`,'good');toast(`依頼達成! +${q.rw}pt`);sfx('sell');
      removeB(b.id,'v');confirmAct=null;
      break;}
    case'release':
      if(confirmAct!=='rel'){confirmAct='rel';actsKey='';}
      else if(b){log(`${bname(b)}を手放した`);removeB(id,'r');confirmAct=null;}
      break;
    case'sell':
      if(confirmAct!=='sell'){confirmAct='sell';actsKey='';}
      else if(b){const p=saleValue(b);S.coins+=p;log(`${bname(b)}を売った +${p}pt`,'good');toast(`${bname(b)}を売りました +${p}pt`);sfx('sell');removeB(id,'o');confirmAct=null;}
      break;
    case'bury':
      if(b){
        let gain=0;
        if(b.natural&&b.size>0){
          const p=Math.round(value(b)*.6);S.coins+=p;gain=p;
          S.spec.push({id:b.id,sp:b.sp,sex:b.sex,size:b.size,col:b.col,cs:b.cs||null,mu:(b.mu||[]).slice(),gen:b.gen,wd:b.wd,inb:b.inb,pa:b.pa,ma:b.ma,day:Math.floor(S.day),life:Math.round(b.adultAge)});
          log(`${bname(b)}を標本にして血統ノートに加えた +${p}pt`,'good');sfx('sell');
        }else log(`${bname(b)}を埋葬した`);
        removeB(id,b.natural&&b.size>0?'p':'b');
        if(gain&&S.ped[id]&&S.ped[id].f==='p'){
          syncLines();
          const k=S.ped[id].bl,r=k&&S.bl[k];
          toast(r&&r.pg?`標本にしました +${gain}pt(血統ノート p.${r.pg} に記録)`:`標本にしました +${gain}pt(血統ノートがいっぱいです。買い足すと記録されます)`);
        }
      }
      break;
    case'reset':
      if(el.dataset.c!=='1'){el.dataset.c='1';el.textContent='本当に最初から? もう一度タップ';return;}
      try{localStorage.removeItem(KEY);localStorage.removeItem(KEY2);localStorage.removeItem(KEY1);}catch(e){}
      {const au=S.audio;fresh();S.audio=au;}tab='shelf';closeSheet();toast('最初から始めます');
      break;
  }
  refresh(true);save();
}

function measFam(F,ups,ctx){

    if(gs.length){
      for(const g of gs){
        if(ctx.done.has(g.k))continue;
        ctx.done.add(g.k);
        const sibs=[g.pa,g.ma].filter(id=>id&&kids.includes(id));
        sibs.forEach(id=>ctx.shown.add(id));
        cells.push({fam:measFam(g,sibs.length?sibs:[kid],ctx)});
      }
    }else cells.push({leaf:kid});
  }
  const cw=cells.map(c=>c.leaf?NW:c.fam.w);
  const total=cw.reduce((a,b)=>a+b,0)+GAPX*Math.max(0,cells.length-1);
  const w=Math.max(total,2*NW+PGAP);
  const h=NH+(cells.length?LZ+Math.max(...cells.map(c=>c.leaf?NH:c.fam.h)):0);
  return{F,ups,cells,cw,total,w,h};
}

  an[F.pa]=mx+NW/2;an[F.ma]=fx+NW/2;

  let ln=`M${mx+NW/2} ${y+NH}V${yb}H${fx+NW/2}V${y+NH}M${cx} ${yb}V${y2}`;
  let xx=x0+(b.w-b.total)/2;
  b.cells.forEach((c,i)=>{
    if(c.leaf){const p=S.ped[c.leaf];out.push(nodeSVG(c.leaf,xx,yt,p?p.sx:'m'));xs.push(xx+NW/2);}

      if(nickOf(b))h+=row('通称',`<b>${esc(nickOf(b).n)}</b> ×${nickOf(b).mult}`);
    }else if(sp.iri)h+=row(sp.gloss?'艶':'体色',esc(colOf(b).n)+' ×'+colOf(b).mult);
    if(sp.iri)h+=row('評価','ランク'+rank(b));
    if(b.stage==='adult'){
      const lf=lifeF(b);
      h+=row('売値',saleValue(b)+'pt'+(lf<1?`(寿命が短く減額中 ×${lf.toFixed(2)})`:''));
      h+=row('休眠・成熟',!mature(b)?`休眠中 あと約${restLeft(b)}日で後食`:!ripe(b)?`成熟中 あと約${ripeLeft(b)}日`:'繁殖OK');
      h+=row('マット',(MATS[b.mat]||MATS.ferm).n);
      h+=row('ゼリー',(JELLY[b.jk]||JELLY.norm).n);
      h+=row('寿命','あと約'+Math.max(0,Math.round((b.life-b.adultAge)/itp(T_AGE,caseT(b))))+'日');
      if(b.sex==='f'){
        h+=row('産卵',b.mated?'卵を準備中 あと約'+Math.max(1,Math.round(b.eggTimer))+'日':b.clutches+' / 3 回');
      }else if(b.cool>0)h+=row('ペア','休憩中 あと約'+Math.round(b.cool)+'日');
    }
    if(b.stage==='dead')h+=row('死因',esc(b.cause));
  }
  if(b.inb>=.5)h+=row('注意','血が濃くなっています。この個体の子は脱落や奇形が出やすくなります。');
  return h;
}
function kbtn(act,attrs,title,price,desc,cur,disabled){
  return`<button class="btn kbtn ${cur?'':'ghost'}" data-act="${act}" ${attrs} ${disabled?'disabled':''} aria-pressed="${cur?'true':'false'}"><span>${title}<small>${price}pt</small></span><em>${desc}</em></button>`;
}
function sheetActs(b){
  let h='';
  const poor=c=>S.coins<c;
  if(b.stage==='egg')h+=`<div class="note">たまごはそっと見守ろう。もうすぐ孵化します。</div>`;
  else if(b.stage==='larva'){
    if(isPre(b))h+=`<div class="note">前蛹です。エサは食べません。蛹になるまでそっとしておこう。</div>`;
    else{
      const fmv=fmOf(b,b.kind),spp=SP[b.sp];
      if(fmv<=.05)h+=`<div class="note warn">⚠ このエサでは${esc(spp.name)}は育ちません。${b.prog<b.larvaDays*.2?'1齢のうちは大丈夫ですが、2齢からは成長が止まります。':'成長が止まり、体力が減っていきます。'}合うエサに交換しよう。<br>メモ: ${esc(spp.mm||'')}</div>`;
      else if(fmv<.6)h+=`<div class="note warn">このエサは${esc(spp.name)}にあまり合っていません(育ちが悪い)。<br>メモ: ${esc(spp.mm||'')}</div>`;
      h+=`<h3>エサの交換</h3><div class="btns">`;
      for(const k of KIND_IDS)h+=kbtn('kind',`data-id="${b.id}" data-k="${k}"`,KINDS[k].n,KINDS[k].price,KINDS[k].d,b.kind===k,poor(KINDS[k].price));
      h+=`</div>`;
    }
  }
  else if(b.stage==='pupa')h+=`<div class="note">蛹室を壊さないように、そっとしておこう。</div>`;
  else if(b.stage==='adult'){
    if(!mature(b))h+=`<div class="note">羽化後の休眠中です。蛹室でじっとしています。あと約${restLeft(b)}日で後食(活動)を始めます。</div>`;
    else{
      h+=`<h3>お世話</h3><ul class="pn"><li>ゼリー: ${esc(JELLY.norm.d)}。ロングゼリー: ${esc(JELLY.long.d)}</li><li>霧吹きは押している間、湿度が増えます。あげすぎると蒸れます${SP[b.sp].muggy?`(この種類は湿度${SP[b.sp].muggy}を超えると蒸れます)`:''}。</li><li>ボタンは各ゲージの右にあります。</li></ul>`;
    }
    h+=`<h3>ケースのマット</h3><div class="btns">`;
    for(const k of['hinoki','ferm','breed'])h+=kbtn('setmat',`data-id="${b.id}" data-m="${k}"`,MATS[k].n,MATS[k].price,MATS[k].d,b.mat===k,b.mat!==k&&poor(MATS[k].price));
    h+=`</div><p class="cap" style="margin:6px 0 0">マットを替えると湿度が30にもどります。</p>`;
    if(mature(b)){
      if(eligible(b)){
        const ps=partners(b),sp=SP[b.sp];
        h+=`<h3>ペアリング</h3>`;
        if(b.sex==='f'){
          h+=`<ul class="chk">${reqs(b).map(r=>`<li class="${r.ok?'ok':'ng'}">${r.ok?'✓':'✗'} ${esc(r.t)}</li>`).join('')}</ul>`;
          if(sp.lay==='wood'&&S.wood<1)h+=`<div class="btns"><button class="btn ghost" data-act="buywood" ${poor(WOOD_PRICE)?'disabled':''}>産卵木を買う <small>${WOOD_PRICE}pt</small></button></div>`;
        }else h+=`<div class="note">繁殖できるかは、メスのケース(マット・産卵木)で決まります。</div>`;
        if(!ps.length)h+=`<div class="note">同じ種類の、成熟した${b.sex==='m'?'メス':'オス'}がいません。</div>`;
        else h+=`<div class="btns">${ps.map(p=>{const k=kinship(b.sex==='f'?b:p,{id:(b.sex==='f'?p:b).id,anc:(b.sex==='f'?p:b).anc});
          return`<button class="btn ghost" data-act="pair" data-a="${b.id}" data-b="${p.id}">${esc(bname(p))} ${p.size}mm${b.sp==='nijiiro'?'('+colName(p)+')':''}${SP[b.sp].ag&&p.sex==='m'?` ${temName(p)}${p.bind?'・アゴ縛り中':''}`:''} と組ませる${k>=.12?` ⚠近縁${Math.round(k*100)}%`:''}</button>`;}).join('')}</div>`;
      }else if(!ripe(b))h+=`<div class="note">後食は始まりましたが、まだ成熟していません。あと約${ripeLeft(b)}日待ってからペアリングしよう(早いと無精卵になりがち)。</div>`;
      else if(b.sex==='f'&&b.clutches>=3)h+=`<div class="note">このメスは3回産卵しました。もう産めません。</div>`;
      if(b.sex==='m'&&SP[b.sp].ag){
        h+=`<h3>アゴ縛り</h3>`;
        if(b.bind)h+=`<div class="note">アゴ縛り中: ペアリングで事故が起きません。解くまで寿命が早く減ります。</div><div class="btns"><button class="btn ghost" data-act="jawoff" data-id="${b.id}">アゴ縛りを解く</button></div>`;
        else h+=`<p class="cap" style="margin:0 0 6px">気性の荒い種類は、ペアリングでメスを傷つけることがあります。成功すると事故を防げます(何度でも挑戦可)。</p><div class="btns"><button class="btn ghost" data-act="jaw" data-id="${b.id}" ${poor(JAW_PRICE)?'disabled':''}>アゴ縛りに挑戦 <small>${JAW_PRICE}pt</small></button></div>`;
      }
    }
  }
  else if(b.stage==='dead')h+=`<div class="btns"><button class="btn" data-act="bury" data-id="${b.id}">${b.natural&&b.size>0?`標本にして累代表に残す +${Math.round(value(b)*.6)}pt`:'埋葬する'}</button></div>`;
  if(b.stage!=='dead'&&S.cel.own){
    h+=`<h3>ワインセラー</h3><div class="btns">`;
    if(b.cel)h+=`<button class="btn ghost" data-act="cellout" data-id="${b.id}">セラーから出す(室温にもどる)</button>`;
    else h+=`<button class="btn ghost" data-act="cellin" data-id="${b.id}" ${cellCount()>=CEL_CAP?'disabled':''}>セラーに入れる(${cellCount()}/${CEL_CAP}・設定${S.cel.t}°C)</button>`;
    h+=`</div>`;
  }
  if(b.stage!=='dead'){
    h+=`<h3>目印(血統・累代の見分け用)</h3><div class="mkrow">${MARKS.map(k=>`<button class="mkb ${b.mark===k?'on':''}" data-act="setmark" data-id="${b.id}" data-k="${k}" aria-pressed="${b.mark===k}">${k||'なし'}</button>`).join('')}</div>
      <div class="mkrow">${MCOLS.map((c,i)=>`<button class="mcb ${b.mc===i?'on':''}" style="background:${c}" data-act="setmc" data-id="${b.id}" data-c="${i}" aria-label="${MCN[i]}" aria-pressed="${b.mc===i}"></button>`).join('')}<button class="mkb ${b.mc<0?'on':''}" data-act="setmc" data-id="${b.id}" data-c="-1">色なし</button></div>
      <h3>配置</h3><div class="btns two"><button class="btn ghost" data-act="mvl" data-id="${b.id}">◀ 左へ</button><button class="btn ghost" data-act="mvr" data-id="${b.id}">右へ ▶</button></div>`;
    if(S.shelves.length>1)h+=`<div class="btns" style="margin-top:8px">${S.shelves.map((x,i)=>i===b.sh?'':`<button class="btn ghost" data-act="toshelf" data-id="${b.id}" data-s="${i}" ${freeIn(i)>0?'':'disabled'}>${esc(x.name)}へ移す(空き${freeIn(i)})</button>`).join('')}</div>`;
    h+=`<div class="btns ${b.stage==='adult'?'two':''}" style="margin-top:14px">`;
    if(b.stage==='adult')h+=`<button class="btn ghost" data-act="sell" data-id="${b.id}">${confirmAct==='sell'?'本当に売る? もう一度':`売る +${saleValue(b)}pt`}</button>`;
    h+=`<button class="btn danger" data-act="release" data-id="${b.id}">${confirmAct==='rel'?'本当に逃がす? もう一度':'逃がす'}</button></div>`;
  }
  return h;
}
function actsSig(b){
  return[b.stage,mature(b),!!b.hib,!!b.bind,S.coins>=JAW_PRICE,isPre(b),b.mated,b.clutches,b.cool>0,free()>=2,S.wood,b.mat,b.jk,b.kind,Math.round(b.stage==='larva'?fmOf(b,b.kind)*10:0),ripe(b),b.cel,S.cel.own,cellCount()>=CEL_CAP,S.cel.t,
    S.coins>=4,S.coins>=6,S.coins>=10,S.coins>=12,S.coins>=14,S.coins>=15,S.coins>=20,S.coins>=25,S.coins>=55,
    confirmAct,partners(b).map(p=>p.id).join('.'),eligible(b),saleValue(b),b.mark,b.mc,b.sh,S.shelves.map((x,i)=>freeIn(i)>0).join('')].join('|');
}
function openSheet(id){
  if(!byId(id))return;
  sheetId=id;confirmAct=null;actsKey='';
  $('sheet').innerHTML=`<div class="sheet-head"><h2 id="sName"></h2><button class="close" data-act="close">閉じる</button></div>
    <div id="sArt" class="art big" data-key=""></div><p class="stage" id="sStage"></p>
    <div id="sCare"></div><div id="sTemp"></div><div id="sBars" data-key=""></div><dl class="info" id="sInfo"></dl><div id="sActs"></div>`;
  $('sheet').hidden=false;$('sheetBack').hidden=false;
  $('sheet').scrollTop=0;
  document.body.style.overflow='hidden';
  updSheet();
}
function closeSheet(){
  holdStop();
  sheetId=null;confirmAct=null;$('sheet').hidden=true;$('sheetBack').hidden=true;document.body.style.overflow='';
}
function updSheet(){
  const b=byId(sheetId);
  if(!b){closeSheet();return;}
  const a=$('sArt'),k=artKey(b);
  if(a.dataset.key!==k){
    a.dataset.key=k;
    const keep=[...a.querySelectorAll('.drop,.spark')];
    a.innerHTML=artSVG(b);keep.forEach(x=>a.appendChild(x));
  }
  $('sName').textContent=bname(b);
  $('sStage').textContent=stageLabel(b)+' · '+genLabel(b);
  const ci=careIssues(b),ch=ci.length?`<div class="care"><b>お世話が必要です</b><ul>${ci.map(x=>`<li class="${x.lv}">${x.lv==='n'?'(注意)':''}${esc(x.t)}</li>`).join('')}</ul></div>`:'';
  const sc=$('sCare');if(sc&&sc.dataset.h!==ch){sc.dataset.h=ch;sc.innerHTML=ch;}
  $('sTemp').innerHTML=b.stage==='dead'?'':tScale(b);
  const sb=$('sBars'),bk=barsKey(b);
  if(sb.dataset.key!==bk){sb.dataset.key=bk;sb.innerHTML=barsHTML(b);}
  updBars(b,sb);
  $('sInfo').innerHTML=sheetInfo(b);
  const ak=actsSig(b);
  if(ak!==actsKey){actsKey=ak;$('sActs').innerHTML=sheetActs(b);}
}
function refresh(force){
  checkAch();
  $('day').textContent=Math.floor(S.day);
  $('season').textContent=seasonOf(S.day);
  $('pt').textContent=Math.floor(S.coins);
  const W=WX[S.wx];
  const sh0=SH();
  $('tempNote').textContent=`${W.i}${W.n} 外気${S.out.toFixed(0)}° / ${sh0.name} 室温${roomT(sh0).toFixed(1)}° 湿度${Math.round(sh0.rh)}%`+(powerCost()>0?` / 電気代 約${powerCost().toFixed(1)}pt/日`:'');
  const an=$('audNote');if(an){const run=Aud.ctx&&Aud.ctx.state==='running';const t=(S.audio.bgm||S.audio.sfx)&&!run?'(画面をタップすると音が出ます)':'';if(an.textContent!==t)an.textContent=t;}
  document.querySelectorAll('#spdSeg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.v===+S.speed)));
  document.querySelectorAll('#audSeg button').forEach(b=>b.setAttribute('aria-pressed',String(!!S.audio[b.dataset.v])));
  const sg=sig();
  if((force||sg!==lastSig)&&!drag){const ae=document.activeElement;if(force||!(ae&&ae.matches&&ae.matches('input')))render();}
  if(tab==='shelf'){
    document.querySelectorAll('.tile[data-id]').forEach(el=>{const b=byId(+el.dataset.id);if(b)updTile(el,b);});
    const cb=$('catchBtn');
    if(cb){const w=Math.ceil((S.catchAt-Date.now())/1000),win=seasonIdx(S.day)===3;cb.disabled=win||w>0;cb.textContent=win?'冬は採集できません':w>0?`準備中 あと${w}秒`:'採集に行く';}
    updEnv();
  }
  if(sheetId!=null&&!holdT)updSheet();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');
  if(!el||el.disabled)return;
  act(el.dataset.act,el);
});
document.addEventListener('pointerdown',e=>{
  const h=e.target.closest('[data-hold="mist"]');
  if(!h||h.disabled)return;
  audInit();h.classList.add('on');holdStart(+h.dataset.id);
});
['pointerup','pointercancel'].forEach(ev=>window.addEventListener(ev,()=>{if(holdT)holdStop();}));
window.addEventListener('blur',()=>{if(holdT)holdStop();});
document.addEventListener('contextmenu',e=>{if(e.target.closest('[data-hold]'))e.preventDefault();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('sheet').hidden)closeSheet();
  if(e.key==='Enter'&&e.target&&e.target.matches&&e.target.matches('[data-act="ped"]')){e.preventDefault();act('ped',e.target);}
  const h=e.target.closest&&e.target.closest('[data-hold="mist"]');
  if(h&&(e.key==='Enter'||e.key===' ')){
    e.preventDefault();
    const b=byId(+h.dataset.id);
    if(b){b.moist=Math.min(100,b.moist+8);b.dT=Math.max(-2.5,(b.dT||0)-.2);fx('mist');sfx('mist');updSheet();}
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t&&t.id==='impFile'&&t.files&&t.files[0]){
    const rd=new FileReader();
    rd.onload=()=>{
      let o=null;try{o=JSON.parse(rd.result);}catch(err){}
      if(!o||typeof o!=='object'||!Array.isArray(o.beetles)||o.day==null){toast('くわがた荘のセーブファイルではないようです');sfx('err');return;}
      if(!confirm(`このセーブ(${Math.floor(o.day)}日目・${o.beetles.filter(b=>b.stage!=='dead').length}匹)を読み込みます。今のデータは上書きされます。よろしいですか?`))return;
      try{o.saved=Date.now();saveLock=true;localStorage.setItem(KEY,JSON.stringify(o));location.reload();}catch(err){toast('読み込みに失敗しました');}
    };
    rd.readAsText(t.files[0]);return;
  }
  if(t&&t.matches&&t.matches('[data-blname]')){
    const r=S.bl[t.dataset.blname];
    if(r){r.name=t.value.replace(/血統$/,'').trim().slice(0,12);save();toast(r.name?`「${r.name}血統」と名づけました`:'血統名を空にしました');}
  }
});
['pointerdown','pointerup','touchstart','touchend','mousedown','click','keydown'].forEach(ev=>document.addEventListener(ev,audInit,{passive:true,capture:true}));

/* ---------- boot ---------- */
S=load();
if(!S)fresh();
else{
  migrate();
  syncLines();
  const el=(Date.now()-(S.saved||Date.now()))/1000;
  if(el>5)catchUp(el);
}
let lastT=Date.now(),saveT=0,uiT=0,hiddenAt=0;
render();refresh(true);
pnBadge();
if(S.pn!==PATCH[0].v)setTimeout(openPatch,600);
/* PWA: オフラインでも起動できるように(https で公開したときだけ) */
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
setInterval(()=>{
  const now=Date.now(),el=(now-lastT)/1000;lastT=now;
  if(document.hidden)return;
  if(el>2.5)catchUp(el);
  else sim(el/DAY_SEC*S.speed,false);
  if(now-uiT>400){uiT=now;refresh(false);}
  if(now-saveT>5000){saveT=now;save();}
},200);
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='hidden'){
    hiddenAt=Date.now();holdStop();save();
    if(Aud.ctx&&Aud.ctx.state==='running'){try{Aud.ctx.suspend();}catch(e){}}
  }else{
    const el=(Date.now()-hiddenAt)/1000;
    if(hiddenAt&&el>5)catchUp(el);
    lastT=Date.now();hiddenAt=0;
    if(Aud.ctx&&Aud.ctx.state==='suspended'){try{Aud.ctx.resume();}catch(e){}}
  }
});
})();
</script>
</body>
</html>
